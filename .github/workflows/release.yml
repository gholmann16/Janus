name: Build release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:12
    env:
      # Container jobs have no /dev/fuse, so appimagetool can't mount to run
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y ca-certificates curl build-essential meson ninja-build gettext libgtk-3-dev libgtksourceview-4-dev appstream file squashfs-tools

      - name: Read version
        run: |
          VERSION=$(grep -oP "version: '\K[^']+" meson.build)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          meson setup build --buildtype release --prefix /usr
          ninja -C build
          DESTDIR="$PWD/../AppDir" meson install -C build

      - name: Fetch go-appimage's appimagetool
        run: |
          URL=$(curl -s https://api.github.com/repos/probonopd/go-appimage/releases/tags/continuous \
            | grep -o 'https://[^"]*appimagetool-[^"]*-${{ matrix.arch }}\.AppImage' | head -1)
          curl -sL -o appimagetool "$URL"
          chmod +x appimagetool

      - name: Bundle GtkSourceView only
        run: |
          ./appimagetool deploy "$PWD/../AppDir/usr/share/applications"/*.desktop
          GSV_LIB=$(find "$PWD/../AppDir" -name 'libgtksourceview-4.so*' | head -1)
          LIBDIR=$(dirname "$GSV_LIB")
          find "$LIBDIR" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          find "$LIBDIR" -maxdepth 1 -type f ! -name 'libgtksourceview-4.so*' -delete

      - name: Bundle GtkSourceView language specs, classic style scheme, and app icon
        run: |
          install -d "$PWD/../AppDir/usr/share/gtksourceview-4/styles"
          cp -a /usr/share/gtksourceview-4/language-specs "$PWD/../AppDir/usr/share/gtksourceview-4/"
          cp /usr/share/gtksourceview-4/styles/classic.xml "$PWD/../AppDir/usr/share/gtksourceview-4/styles/"
          ln -sf usr/share/icons/hicolor/256x256/apps/dev.pantheum.janus.png "$PWD/../AppDir/dev.pantheum.janus.png"

      - name: Build AppImage
        run: |
          ARCH=${{ matrix.arch }} VERSION="$VERSION" ./appimagetool "$PWD/../AppDir"

      - uses: actions/upload-artifact@v4
        with:
          name: janus-appimage-${{ matrix.arch }}
          path: '*.AppImage*'

  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The action needs flatpak-builder plus a privileged, effectively-root environment to install runtimes
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Point manifest at whatever ref triggered this build
        run: |
          sed -i "s/branch: main/branch: ${GITHUB_REF_NAME}/" data/dev.pantheum.janus.yml

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: janus-${{ matrix.arch }}.flatpak
          manifest-path: data/dev.pantheum.janus.yml
          arch: ${{ matrix.arch }}
          cache: true

  deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            deb_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:12
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y git ca-certificates build-essential meson ninja-build gettext libgtk-3-dev libgtksourceview-4-dev dpkg-dev appstream

      - name: Read version
        run: |
          VERSION=$(grep -oP "version: '\K[^']+" meson.build)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          meson setup build --buildtype release --prefix /usr
          ninja -C build

      - name: Package deb
        run: |
          sed -i "s/^Version: .*/Version: $VERSION-1/" data/control
          sed -i "s/^Architecture: .*/Architecture: ${{ matrix.deb_arch }}/" data/control
          PKGDIR="$PWD/../janus-notepad_${VERSION}-1_${{ matrix.deb_arch }}"
          rm -rf "$PKGDIR"
          DESTDIR="$PKGDIR" meson install -C build
          install -Dm644 data/control "$PKGDIR/DEBIAN/control"
          dpkg-deb --root-owner-group -b "$PKGDIR" "janus-notepad_${VERSION}-1_${{ matrix.deb_arch }}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: janus-deb-debian12-${{ matrix.arch }}
          path: janus-notepad_*.deb

  rpm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: rockylinux:8
    steps:
      # actions/checkout falls back to a git-less REST API download when git
      # isn't in PATH yet, so it has to be installed before checkout runs.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y ca-certificates epel-release dnf-plugins-core
          dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb
          dnf install -y rpm-build
          dnf builddep -y data/janus.spec

      - name: Read version
        run: |
          VERSION=$(grep -oP "version: '\K[^']+" meson.build)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Package rpm
        run: |
          git config --global --add safe.directory '*'
          sed -i "s/^Version: .*/Version: $VERSION/" data/janus.spec
          sed -i "s/^ExclusiveArch: .*/ExclusiveArch: ${{ matrix.arch }}/" data/janus.spec
          mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          echo '%_topdir %(echo $HOME)/rpmbuild' > "$HOME/.rpmmacros"
          cp data/janus.spec "$HOME/rpmbuild/SPECS/"
          git archive --output="$HOME/rpmbuild/SOURCES/janus-notepad-${VERSION}.tar.gz" --prefix="janus-notepad-${VERSION}/" HEAD
          rpmbuild -bb "$HOME/rpmbuild/SPECS/janus.spec"

      - uses: actions/upload-artifact@v4
        with:
          name: janus-rpm-el8-${{ matrix.arch }}
          # Container jobs get $HOME forced to /github/home by the runner, not /root.
          path: /github/home/rpmbuild/RPMS/**/*.rpm

  publish:
    needs: [appimage, flatpak, deb, rpm]
    runs-on: ubuntu-latest
    # Only touch the Releases page for tag-triggered runs; branch dispatches
    # are build-only tests and should just leave plain Actions artifacts.
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Draft a release with these assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          draft: true
