name: Build packages

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    runs-on: ubuntu-latest
    container: debian:11
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y git ca-certificates build-essential meson ninja-build gettext libgtk-3-dev libgtksourceview-4-dev dpkg-dev

      - name: Build
        run: |
          meson setup build --buildtype release --prefix /usr
          ninja -C build

      - name: Package deb
        run: |
          rm -rf ../janus-notepad_0.9.7-1
          DESTDIR=../janus-notepad_0.9.7-1 meson install -C build
          install -Dm644 data/control ../janus-notepad_0.9.7-1/DEBIAN/control
          dpkg-deb --root-owner-group -b ../janus-notepad_0.9.7-1 janus-notepad_0.9.7-1.deb

      - uses: actions/upload-artifact@v4
        with:
          name: janus-deb-debian11
          path: janus-notepad_0.9.7-1.deb

  rpm:
    runs-on: ubuntu-latest
    container: rockylinux:8
    steps:
      # actions/checkout falls back to a git-less REST API download when git
      # isn't in PATH yet, so it has to be installed before checkout runs.
      - name: Install git
        run: dnf install -y git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y ca-certificates epel-release dnf-plugins-core
          dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb
          dnf install -y rpm-build
          dnf builddep -y data/janus.spec

      - name: Package rpm
        run: |
          git config --global --add safe.directory '*'
          mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          echo '%_topdir %(echo $HOME)/rpmbuild' > "$HOME/.rpmmacros"
          cp data/janus.spec "$HOME/rpmbuild/SPECS/"
          git archive --output="$HOME/rpmbuild/SOURCES/janus-notepad-0.9.7.tar.gz" --prefix=janus-notepad-0.9.7/ HEAD
          rpmbuild -bb "$HOME/rpmbuild/SPECS/janus.spec"

      - uses: actions/upload-artifact@v4
        with:
          name: janus-rpm-el8
          path: /root/rpmbuild/RPMS/**/*.rpm
