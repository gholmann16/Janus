name: PR build check

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential meson ninja-build gettext libgtk-3-dev libgtksourceview-4-dev

      - name: Build
        run: |
          meson setup build
          ninja -C build
